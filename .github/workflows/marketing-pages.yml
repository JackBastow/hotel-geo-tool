# Builds the marketing site (marketing/src -> marketing/public) and publishes it to GitHub Pages whenever it changes on main.
# One-off setup in GitHub: Settings > Pages > Source: "GitHub Actions", then add your custom domain there.
name: Marketing site

on:
  push:
    branches: [main]
    paths: ["marketing/**", ".github/workflows/marketing-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python marketing/build.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/public
      - id: deployment
        uses: actions/deploy-pages@v4
