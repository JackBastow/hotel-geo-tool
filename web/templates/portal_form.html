{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<section class="lead" style="margin-top:34px"><h1>{{ heading }}</h1><p>{{ intro }}</p></section>
<form class="panel" method="post" style="max-width:440px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% for f in fields %}<label class="field"><span>{{ f.label }}</span><input type="{{ f.type }}" name="{{ f.name }}" value="{{ f.value or '' }}" {% if f.autofocus %}autofocus{% endif %} autocomplete="{{ f.auto }}" {% if f.readonly %}readonly{% endif %}></label>{% endfor %}
  <button class="btn primary" type="submit">{{ button }}</button>
  {% if error %}<div class="err" style="margin-top:14px">{{ error }}</div>{% endif %}
</form>
{% endblock %}
{% block foot %}{% endblock %}
