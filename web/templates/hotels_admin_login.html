{% extends "base.html" %}
{% block title %}Hotels admin{% endblock %}
{% block brand %}<a class="brand" href="{{ base }}"><span class="mark">H</span>Hotels admin</a>{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<h1>Hotels admin</h1>
<form class="panel" method="post" style="max-width:420px">
  <label class="field"><span>Password</span><input type="password" name="password" autofocus autocomplete="current-password"></label>
  <button class="btn primary" type="submit">Sign in</button>
  {% if error %}<div class="err" style="margin-top:12px">{{ error }}</div>{% endif %}
</form>
{% endblock %}
